<style>

.layer{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:540px 600px;}

.tile{border-radius:5px;}
.track{background:var(--track);border-radius:3px;}
.fill{border-radius:3px;}
.rib{border-radius:4px;transform-origin:0 50%;}

.tray{border:3px solid var(--ink);border-radius:8px;}

.lbl.acc{color:var(--acc);font-weight:800;font-size:30px;}
.lbl .sm{font-size:28px;font-weight:500;color:var(--ink2);}
.cnt{font-size:52px;font-weight:800;line-height:1.2;white-space:nowrap;transform-origin:0 50%;}
.ghost{border:3px dashed var(--ink2);border-radius:3px;height:22px;}
.brk{border:3px solid var(--ink);border-top:none;height:18px;}
.cell{width:40px;height:40px;border-radius:4px;background:var(--track);}
.cell.slow{background:var(--ink);}
.fml{font-size:48px;font-weight:600;white-space:nowrap;}
.fml sup{font-size:28px;}
.pct{font-size:120px;font-weight:900;line-height:1.1;white-space:nowrap;}
.gauge{width:456px;height:112px;}
.gauge .gl{font-size:28px;color:var(--ink);font-weight:700;line-height:1.2;}
.gauge svg{display:block;margin-top:8px;}
.tx{position:absolute;left:64px;white-space:nowrap;opacity:0;line-height:1.3;}

.cnd{font-size:56px;font-weight:900;line-height:1.3;white-space:nowrap;}

<body>
<div id="stage">
  <div id="grp" class="layer"></div>
  <div id="grid" class="layer"></div>
  <div id="fanL" class="layer"></div>
  <div id="txt" class="layer"></div>
</div>
<script>
(function(){
"use strict";
var INK="#1E1C19",RUN="#3A3631",GREY="#BBB3A6",ACC="#0E7C66",TRACK="#E2DACB";
var END=57.5,FILM=59.5;
var CL=[["S0",0,4.0],["S1",4.0,10.0],["F1",10.0,17.0],["F2",17.0,25.0],["F3",25.0,33.5],["F4",33.5,40.0],["F5",40.0,51.0],["E1",51.0,55.0],["E2",55.0,57.5]];
var QY=300;
function clamp(x,a,b){if(a===undefined)a=0;if(b===undefined)b=1;return x<a?a:(x>b?b:x);}
function win(t,a,b){return clamp((t-a)/(b-a));}
function eo(x){return 1-Math.pow(1-x,3);}
function eio(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function lerp(a,b,k){return a+(b-a)*k;}
function hx(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function mixc(a,b,k){var x=hx(a),y=hx(b);return "rgb("+Math.round(lerp(x[0],y[0],k))+","+Math.round(lerp(x[1],y[1],k))+","+Math.round(lerp(x[2],y[2],k))+")";}
function qx(i){return 132+i*40;}
function cxy(c){return [820+(c%4)*48,420+Math.floor(c/4)*48];}
var RAD=Math.PI/180;

var grp=document.getElementById("grp"),gridL=document.getElementById("grid"),fanL=document.getElementById("fanL"),txL=document.getElementById("txt");
var ALL=[];
function mk(parent,cls,html){var e=document.createElement("div");e.className=cls;if(html!==undefined)e.innerHTML=html;parent.appendChild(e);ALL.push(e);return e;}
// a shared stage element drawn by both clips at a seam keeps the larger opacity,
// so a container never vanishes before its contents
function box(e,x,y,w,h,o,bg){if(o<e._o)return;e._o=o;var s=e.style;s.left=x+"px";s.top=y+"px";if(w!=null)s.width=Math.max(0,w)+"px";if(h!=null)s.height=h+"px";s.opacity=o;if(bg)s.background=bg;}

// ---------- stage elements ----------
var i;
var TL=[];for(i=0;i<51;i++)TL.push(mk(grp,"a tile"));
var TR=[],FI=[];for(i=0;i<40;i++){TR.push(mk(grp,"a track"));FI.push(mk(grp,"a fill"));}
var CH=[];for(i=0;i<20;i++)CH.push(mk(grp,"a chip"));
var WS=[];for(i=0;i<6;i++)WS.push(mk(grp,"a wall"));
var ST=[];for(i=0;i<4;i++)ST.push(mk(grp,"a stamp","429"));
var trayBox=mk(grp,"a tray"),trayHead=mk(grp,"a lbl","結果"),cntLbl=mk(grp,"a lbl","回來的結果"),cnt=mk(grp,"a cnt"),simL=mk(grp,"a lbl","示意");
var trayStat=mk(grp,"a lbl b","還差 1 個"),trayDone=mk(grp,"a lbl acc","全部回來");
var qLbl=mk(grp,"a lbl","佇列");
var bLbl=mk(grp,"a lbl b","用量額度 <span class='sm'>(usage limit)</span>"),bTr=mk(grp,"a track"),bFi=mk(grp,"a fill");
var tLbl=mk(grp,"a lbl b","吞吐量 <span class='sm'>(throughput)</span>"),tTr=mk(grp,"a track"),tFi=mk(grp,"a fill");
var wLbl=mk(grp,"a lbl b","下游上限<br><span class='sm'>（API、資料庫）</span>");
var pLbl=mk(grp,"a lbl b","工作池"),pBar=mk(grp,"a fill"),pTxt=mk(grp,"a lbl b");
var gLbl=mk(grp,"a lbl b","逐一做"),GH=[];for(i=0;i<5;i++)GH.push(mk(grp,"a ghost"));var gTxt=mk(grp,"a lbl b","5 秒"),gFill=mk(grp,"a fill");
var brk=mk(grp,"a brk"),brkL=mk(grp,"a lbl b","等最慢的那一個"),usedL=mk(grp,"a used","用完");
var nLbl=mk(grp,"a lbl b");
var SVGA='<svg width="456" height="64" viewBox="0 0 456 64"><line x1="0" y1="62" x2="456" y2="62" stroke="#BBB3A6" stroke-width="2"/><polyline fill="none" stroke="#1E1C19" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" points="';
var g1=mk(grp,"a gauge",'<div class="gl">429 次數：變少</div>'+SVGA+'4,8 70,14 130,12 190,30 250,38 310,48 370,52 452,55"/></svg>');
var g2=mk(grp,"a gauge",'<div class="gl">排隊長度：不會一直變長</div>'+SVGA+'4,34 70,30 130,36 190,31 250,35 310,32 370,34 452,33"/></svg>');
var gPL=[g1.querySelector("polyline"),g2.querySelector("polyline")];
// grid layer (F3)
var GC=[];for(i=0;i<100;i++){GC.push(mk(gridL,"a cell"+(i===63?" slow":"")));}
var fml=mk(gridL,"a fml","1 − 0.99<sup>100</sup>"),pct=mk(gridL,"a pct");
// fan layer: the S0 fan (big, it becomes the lanes) and the small fan (F3 insert, E1 fold, end-card mark)
// drawn as SVG: leaf band (annular sector over the outer part of the ribs), 20 ribs, a rivet at the pivot
var NS="http://www.w3.org/2000/svg",SVGE=[];
function se(parent,tag){var e=document.createElementNS(NS,tag);parent.appendChild(e);SVGE.push(e);return e;}
var fanSvg=document.createElementNS(NS,"svg");fanSvg.setAttribute("width","1080");fanSvg.setAttribute("height","1350");fanSvg.style.position="absolute";fanSvg.style.left="0";fanSvg.style.top="0";fanL.appendChild(fanSvg);
var leafP=se(fanSvg,"path");leafP.setAttribute("fill",INK);leafP.setAttribute("fill-opacity","0.16");leafP.setAttribute("stroke",INK);leafP.setAttribute("stroke-width","2.5");leafP.setAttribute("stroke-linejoin","round");
var RB=[];for(i=0;i<20;i++){var ln=se(fanSvg,"line");RB.push(ln);}
var rivet=se(fanSvg,"circle");rivet.setAttribute("fill",INK);
var FT=[];for(i=0;i<20;i++)FT.push(mk(fanL,"a tile"));

function tile(k,x,y,s,c,o){var e=TL[k],st=e.style;st.left=x+"px";st.top=y+"px";st.width=s+"px";st.height=s+"px";st.background=c;st.opacity=o;}
function ftile(k,x,y,s,c,o){var e=FT[k],st=e.style;st.left=x+"px";st.top=y+"px";st.width=s+"px";st.height=s+"px";st.background=c;st.opacity=o;}
function sop(e,o){if(o<e._o)return false;e._o=o;e.style.opacity=o;return true;}
function rib(k,px,py,len,ang,th,col,o){var e=RB[k];if(!sop(e,o))return;
  e.setAttribute("x1",px.toFixed(2));e.setAttribute("y1",py.toFixed(2));
  e.setAttribute("x2",(px+len*Math.cos(ang*RAD)).toFixed(2));e.setAttribute("y2",(py+len*Math.sin(ang*RAD)).toFixed(2));
  e.setAttribute("stroke",col);e.setAttribute("stroke-width",th.toFixed(2));}
function pt(px,py,r,a){return (px+r*Math.cos(a*RAD)).toFixed(2)+","+(py+r*Math.sin(a*RAD)).toFixed(2);}
function leaf(px,py,r1,r2,a0,a1,o){if(!sop(leafP,o))return;
  var lg=(a1-a0)>180?1:0;
  leafP.setAttribute("d","M"+pt(px,py,r1,a0)+" L"+pt(px,py,r2,a0)+" A"+r2+","+r2+" 0 "+lg+" 1 "+pt(px,py,r2,a1)+" L"+pt(px,py,r1,a1)+" A"+r1+","+r1+" 0 "+lg+" 0 "+pt(px,py,r1,a0)+" Z");}
function rivetAt(px,py,r,o){if(!sop(rivet,o))return;rivet.setAttribute("cx",px);rivet.setAttribute("cy",py);rivet.setAttribute("r",r);}
function track(k,x,y,w,h,o){box(TR[k],x,y,w,h,o);}
function fill(k,x,y,w,h,p,c,o){box(FI[k],x,y,w*clamp(p),h,o,c);}
function wall(x,y0,y1,gaps,o){var segs=[],cur=y0;for(var g=0;g<gaps.length;g++){if(gaps[g][0]>cur)segs.push([cur,gaps[g][0]]);cur=gaps[g][1];}if(cur<y1)segs.push([cur,y1]);for(var s=0;s<WS.length;s++){if(s<segs.length)box(WS[s],x,segs[s][0],null,segs[s][1]-segs[s][0],o);}}
function tray(o){box(trayBox,800,370,216,450,o);box(trayHead,818,378,null,null,o);}
function counter(txt,o,sc){cnt.textContent=txt;box(cntLbl,818,668,null,null,o);box(cnt,818,702,null,null,o);cnt.style.transform="scale("+(sc||1)+")";}
function queueLabel(o){box(qLbl,64,QY-2,null,null,o);}
function budget(f,o){box(bLbl,64,876,null,null,o);box(bTr,64,925,952,22,o);box(bFi,64,925,952*f,22,o,RUN);}
// the small fan (the S0 fan again: leaf band, ribs, rivet), pivot at the lower left, ribs pointing up;
// spread[i] in 0..1 (0 = folded); span = full opening angle; the leaf covers every rib except one held out
var SFX=240,SFY=1290,SFL=400;
function smallFan(spread,o,span,outRib){
  var a0=1e9,a1=-1e9;
  for(var k=0;k<20;k++){
    var f=k/19-0.5,sp=spread.length?spread[k]:spread;
    var ang=-90+f*span*lerp(0.15,1,sp);
    // guard sticks stay thick; inner ribs thin out as they fold so the closed fan shows its leaf, not a solid spike
    var guard=(k===0||k===19);
    rib(k,SFX,SFY,SFL,ang,guard?5:lerp(1.4,4,sp),guard?INK:mixc(GREY,INK,sp),o);
    if(k!==outRib){a0=Math.min(a0,ang);a1=Math.max(a1,ang);}
  }
  leaf(SFX,SFY,SFL*0.6,SFL,a0-0.6,a1+0.6,o);
  rivetAt(SFX,SFY,11,o);
}

// generic job: queue -> lane -> tray chip
function job(u,o,ti,li,sy,sh,ts,ci,qi,pu,st,en,ld,frz){
  var x,y,s,c=INK,ty=sy+(sh-ts)/2,tx0=64,LW=676,p=-1,pc=RUN,po=0;
  if(u<pu){x=qx(qi);y=QY;s=28;}
  else if(u<st){var k=eio(win(u,pu,st));x=lerp(qx(qi),tx0,k);y=lerp(QY,ty,k);s=lerp(28,ts,k);}
  else if(frz!=null&&u>=frz){var pf=win(frz,st,en),kf=win(u,frz,frz+0.3);x=tx0+pf*(LW-ts);y=ty;s=ts;c=mixc(INK,GREY,kf);p=pf;pc=mixc(RUN,GREY,kf);po=1;}
  else if(u<en){var pp=win(u,st,en);x=tx0+pp*(LW-ts);y=ty;s=ts;p=pp;po=1;}
  else if(u<ld){var k2=eio(win(u,en,ld)),cp=cxy(ci);x=lerp(tx0+LW-ts,cp[0],k2);y=lerp(ty,cp[1],k2);s=lerp(ts,40,k2);c=ACC;p=1;po=1-k2;}
  else {var cp2=cxy(ci);x=cp2[0];y=cp2[1];s=40;c=ACC;}
  tile(ti,x,y,s,c,o);
  if(p>=0)fill(li,64,sy,LW,sh,p,pc,o*po);
}

var zoom=1;
// ---------- clips (u = seconds into the clip, o = opacity multiplier) ----------
function s1y(k){return 380+k*24;}
function S0(u,o){
  // one tile opens into 20 ribs like a hand fan, then the ribs straighten into the 20 lanes
  var open=eio(win(u,0.3,1.3)),straight=eio(win(u,3.0,4.0));
  var breathe=1+0.05*Math.sin(2*Math.PI*(u-1.3)/2.4)*win(u,1.3,1.7)*(1-win(u,2.8,3.0));
  var ro=o*eo(win(u,0.25,0.45));
  for(var k=0;k<20;k++){
    var f=k/19-0.5,ang=f*80*open*breathe,ly=s1y(k);
    var px=lerp(100,64,straight),py=lerp(640,ly+6,straight),len=lerp(560,676,straight),a=lerp(ang,0,straight);
    rib(k,px,py,len,a,lerp(4,12,straight),mixc(INK,TRACK,straight),ro);
    // the single tile splits; each part rides its rib outward
    // under the title hold the tiles keep travelling out along their ribs to the leaf edge ("sending out")
    var r=lerp(0,280,open)+220*eio(win(u,0.9,3.2)),s=lerp(28,22,open);
    var fx=100+r*Math.cos(ang*RAD)-s/2,fy=640+r*Math.sin(ang*RAD)-s/2;
    var x=lerp(fx,64,straight),y=lerp(fy,ly-2,straight),sz=lerp(s,16,straight);
    ftile(k,x,y,sz,INK,o*eo(win(u,0.0,0.2)));
  }
  // the leaf band over the outer third of the ribs makes it read as a hand fan; it lifts off as the ribs straighten
  var hw=40*open*breathe,lo=ro*(1-win(u,2.85,3.25));
  if(hw>0.3)leaf(100,640,560*0.67,560,-hw-0.6,hw+0.6,lo);
  rivetAt(100,640,lerp(9,12,open),lo);
}
function S1(u,o){
  var p=0.35*win(u,0.3,2.6),fz=win(u,2.6,2.9);
  var col=mixc(INK,GREY,fz),rc=mixc(RUN,GREY,fz);
  for(var k=0;k<20;k++){
    var ly=s1y(k);
    tile(k,64+p*(676-16),ly-2,16,col,o);
    track(k,64,ly,676,12,o);
    fill(k,64,ly,676,12,p,rc,o);
  }
  var tb=o*eo(win(u,0.0,0.4));
  tray(tb);
  var bump=Math.sin(Math.PI*win(u,2.9,3.35));
  counter("0 / 20",tb,1+0.14*bump);
  budget(1-win(u,0.3,2.6),o*eo(win(u,0.0,0.3)));
  box(usedL,952,872,null,null,o*eo(win(u,2.6,2.9)));
}
var F1DUR=7.0,F1A=[1.4,2.1,2.8,2.8,3.5,3.6,3.7,3.8];
function f1y(k){return 392+56*k;}
function F1(u,o,asPrev){
  queueLabel(o*eo(win(u,0.2,0.5)));
  for(var k=0;k<12;k++)tile(32+k,qx(k),QY,28,INK,o*eo(win(u,0.3+k*0.02,0.6+k*0.02)));
  tray(o);
  var wo=o*eo(win(u,1.0,1.4)),gaps=[];
  for(var g=0;g<4;g++)gaps.push([f1y(g)-10,f1y(g)+30]);
  wall(770,372,820,gaps,wo);box(wLbl,790,830,null,null,wo);
  var to=o*eo(win(u,1.0,1.4));
  var tp=0.25*eo(win(u,1.4,1.8))+0.25*eo(win(u,2.1,2.5))+0.5*eo(win(u,2.8,3.2));
  box(tLbl,64,876,null,null,to);box(tTr,64,925,952,22,to);box(tFi,64,925,666*tp,22,to,ACC);
  // results that pass the limit line stay in the tray
  var total=0;
  for(var c0=0;c0<4;c0++){if(u>=F1A[c0])total+=Math.floor(((u-F1A[c0])+c0*0.23)/0.9);}
  for(var c=0;c<Math.min(total,20);c++){var cp=cxy(c);box(CH[c],cp[0],cp[1],null,null,o);}
  for(var i2=0;i2<8;i2++){
    var a=F1A[i2];if(u<a)continue;
    var lo=o*eo(win(u,a,a+0.25)),y=f1y(i2);
    if(!asPrev)track(20+i2,64,y,676,20,lo);
    if(i2<4){
      var ph=(((u-a)+i2*0.23)%0.9)/0.9;
      if(ph<0.8){var pp=ph/0.8;if(!asPrev)fill(20+i2,64,y,676,20,pp,RUN,lo);tile(24+i2,64+pp*(676-24),y-2,24,INK,lo);}
      else{var kk=eio((ph-0.8)/0.2),tc=cxy(Math.min(total,19));if(!asPrev)fill(20+i2,64,y,676,20,1,RUN,lo*(1-kk));tile(24+i2,lerp(716,tc[0],kk),lerp(y-2,tc[1],kk),lerp(24,40,kk),ACC,total<20?lo:lo*(1-kk));}
    }else{
      var k1=eio(win(u,a,a+0.45)),k2=eo(win(u,a+0.45,a+0.8));
      var x=(u<a+0.45)?lerp(64,746,k1):lerp(746,520,k2);
      tile(24+i2,x,y-2,24,mixc(INK,GREY,k2),lo);
      if(!asPrev)fill(20+i2,64,y,676,20,(x+24-64)/676,mixc(RUN,GREY,k2),lo);
      box(ST[i2-4],x-100,y-10,null,null,lo*eo(win(u,a+0.4,a+0.55)));
    }
  }
}
function F2(u,o){
  queueLabel(o);tray(o);
  var kc=eio(win(u,0,0.5));
  // F1's last fills ride along with the collapsing lanes for the first beat
  if(u<0.5){for(var kf=0;kf<8;kf++){
    var jf=Math.min(kf,2),pf,cf=RUN;
    if(kf<4){var phf=(((F1DUR-F1A[kf])+kf*0.23)%0.9)/0.9;pf=phf<0.8?phf/0.8:1;}else{pf=(520+24-64)/676;cf=GREY;}
    fill(kf,64,lerp(f1y(kf),430+120*jf,kc),676,lerp(20,56,kc),pf,cf,o*(1-kc));}}
  for(var k=0;k<8;k++){
    var j=Math.min(k,2),y=lerp(f1y(k),430+120*j,kc),h=lerp(20,56,kc);
    track(k,64,y,676,h,k<3?o:o*(1-kc));
  }
